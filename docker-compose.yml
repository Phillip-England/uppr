# Generated by uppr. Edit workspace repos.conf files, then run `uppr generate-server`.
services:
  uppr:
    build:
      context: .
    image: ${UPPR_DOCKER_IMAGE:-uppr:local}
    restart: unless-stopped
    env_file:
      - ./config/.env
    working_dir: "/home/deploy/Server/uppr"
    command: ["uppr", "serve", "--addr", "0.0.0.0:9944", "/home/deploy/Server/uppr"]
    volumes:
      - "/home/deploy/Server/uppr:/home/deploy/Server/uppr"
      - "/home/deploy/.local/share/uppr/workspaces/personal:/home/deploy/.local/share/uppr/workspaces/personal"
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default

  caddy:
    depends_on:
      - uppr
    build:
      context: .
      dockerfile: caddyx.Dockerfile
    image: uppr-caddyx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default

  personal-cleaver:
    build:
      context: "/home/deploy/.local/share/uppr/workspaces/personal/apps/cleaver"
    restart: unless-stopped
    env_file:
      - "/home/deploy/.local/share/uppr/workspaces/personal/apps/cleaver/config/.env"
    volumes:
      - "/home/deploy/.local/share/uppr/workspaces/personal/apps/cleaver/config:/app/config"
      - "/home/deploy/.local/share/uppr/workspaces/personal/apps/cleaver/data:/app/data"

  personal-portfolio:
    build:
      context: "/home/deploy/.local/share/uppr/workspaces/personal/apps/portfolio"
    restart: unless-stopped
    env_file:
      - "/home/deploy/.local/share/uppr/workspaces/personal/apps/portfolio/config/.env"
    volumes:
      - "/home/deploy/.local/share/uppr/workspaces/personal/apps/portfolio/config:/app/config"
      - "/home/deploy/.local/share/uppr/workspaces/personal/apps/portfolio/data:/app/data"

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    external: true
    name: ${UPPR_DOCKER_NETWORK:-uppr-network}
